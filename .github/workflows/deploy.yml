name: Deploy to GitHub Pages
# 🌐 Live: https://marinellibr.github.io/data-analytics-dashboard

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (builds creamy-kit via prepare)
        run: npm install

      - name: Build Angular project
        run: npm run build -- --configuration production

      # GitHub Pages has no server-side SPA fallback: a hard refresh or direct
      # visit to a deep link (e.g. /creamy-angular/dashboard/2026-06-18/band/tarde)
      # would 404. Serving a 404.html that is a copy of index.html lets Angular's
      # router take over and resolve any route client-side.
      - name: SPA fallback (404.html = index.html)
        run: cp dist/data-analytics-dashboard/browser/index.html dist/data-analytics-dashboard/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/data-analytics-dashboard/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
