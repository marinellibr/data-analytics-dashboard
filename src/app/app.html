<div class="wip-container">
  <creamy-kit-card class="wip-card">
    <div class="wip-header">
      <creamy-kit-icon name="construction" [size]="48" color="var(--primary-base)"></creamy-kit-icon>
      <h1>Em Construção</h1>
      <p class="subtitle">Data Analytics Dashboard</p>
    </div>

    <div class="wip-animation">
      <div class="spinner"></div>
    </div>

    <div class="wip-content">
      <p class="message">
        Estamos trabalhando para trazer você uma experiência incrível.
      </p>
      <p class="subtitle-small">
        Volte em breve!
      </p>
    </div>

    <div class="wip-actions">
      <creamy-kit-button appearance="solid" size="medium">
        <creamy-kit-icon name="arrow_right" [size]="16" color="currentColor"></creamy-kit-icon>
        Acompanhar
      </creamy-kit-button>
    </div>
  </creamy-kit-card>
</div>
